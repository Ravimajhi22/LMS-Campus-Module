
server.port=9191
spring.application.name=TRANSPORT-SERVICE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/campus_facilities_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
jwt.secret=lms_prod_jwt_secret_change_this_very_long_random_string_987654321
spring.security.user.name=disabled
spring.security.user.password=disabled
server.max-http-request-header-size=128KB
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

# Detect leaked connections
spring.datasource.hikari.leak-detection-threshold=20000